<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wght@400;600&family=Schibsted+Grotesk:wght@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f7f8f4; color: #1d2b3a; font-family: 'Atkinson Hyperlegible', sans-serif; padding: 64px 72px; position: relative; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 0; font: 800 30px/1 'Schibsted Grotesk', sans-serif; }
  .bc { display: inline-grid; place-items: center; width: 34px; height: 40px; border: 2px solid #1d2b3a; margin-right: -2px; font: 600 18px/1 'Martian Mono', monospace; }
  .bc + .bc { margin-right: 12px; }
  h1 { font: 800 76px/1.02 'Schibsted Grotesk', sans-serif; letter-spacing: -0.02em; margin-top: 54px; max-width: 900px; }
  .row { display: flex; align-items: center; gap: 28px; margin-top: 44px; }
  .cells { display: flex; }
  .cell { width: 74px; height: 96px; border: 2px solid #1d2b3a; margin-left: -2px; display: grid; place-items: center; font: 600 54px/1 'Martian Mono', monospace; background: #f7f8f4; }
  .cell:first-child { margin-left: 0; }
  .cell.v { color: #5b3fa8; }
  .txt { font-size: 30px; line-height: 1.3; max-width: 560px; }
  .txt b { color: #5b3fa8; }
  .tab { position: absolute; right: -40px; top: 0; bottom: 0; width: 230px; background: repeating-linear-gradient(#e3efe4 0 42px, #f7f8f4 42px 84px); border-left: 2px dashed #cfe0d1; }
  .src { position: absolute; left: 72px; bottom: 44px; font: 400 18px/1 'Martian Mono', monospace; color: #56645f; }
</style>
</head>
<body>
  <div class="tab"></div>
  <div class="top"><span class="bc">R</span><span class="bc">B</span>Radar Bandi</div>
  <h1>Soldi pubblici per la tua attività: quali puoi chiedere oggi?</h1>
  <div class="row">
    <div class="cells"><span class="cell">5</span><span class="cell">?</span><span class="cell v">✓</span></div>
    <p class="txt">Cinque domande, <b>i bandi aperti per te</b>. Gratis, senza registrazione.</p>
  </div>
  <p class="src">Dati ufficiali incentivi.gov.it · aggiornati ogni giorno</p>
</body>
</html>
