name: Radar Bandi — aggiornamento giornaliero

on:
  schedule:
    - cron: '15 4 * * *' # ogni mattina alle 06:15 ora italiana (estate)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'data/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-bandi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # incentivi.gov.it spesso non risponde agli IP esteri dei runner GitHub.
      # In quel caso si ricostruisce con gli ultimi dati salvati (spinti ogni mattina da un PC in Italia).
      - name: Scarica i bandi da incentivi.gov.it
        id: fetch
        continue-on-error: true
        run: node scripts/fetch.mjs

      - name: Salva i dati del giorno nel repository
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "radar-bandi-bot"
          git config user.email "radar-bandi-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Dati bandi $(date -u +%F)"
          git pull --rebase --quiet && git push

      - name: Costruisci il sito
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Dopo la pubblicazione: segnala ai motori di ricerca (IndexNow) i bandi comparsi negli ultimi giorni.
  ping:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
